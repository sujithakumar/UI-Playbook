<!DOCTYPE html>
<html>

<head>
    <style>
        a:link {
            color: blue;
        }

        a:visited {
            color: purple;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: orange;
        }

        a:focus {
            outline: 3px solid yellow;
        }

        section:target {
            background-color: pink;
            outline: 3px solid orange;
        }
    </style>
</head>

<body>
    <nav>
        <a href="#home">Home</a> &nbsp;&nbsp;
        <a href="#about">About</a>&nbsp;&nbsp;
        <a href="https://example.com">External Link</a>
    </nav>
    <section id="home">
        <h2>Home</h2>
        <p>This is the Home section.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>This section is targeted when the URL contains #about.</p>
    </section>
</body>
