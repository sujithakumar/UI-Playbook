<!DOCTYPE html>
<html>

<head>
    <title>CSS Pseudo Classes </title>
    <link rel="stylesheet" href="../styles/pseudo-class.css">
</head>

<body>

    <h1>CSS Pseudo-Classes & Pseudo-Elements</h1>

    <p lang="fr">Bonjour! Ceci est un paragraphe français.</p>
    <p lang="en">Hello! This is an English paragraph.</p>

    <div class="empty-box"></div>
    <div class="non-empty-box">
        This box is not empty.
    </div>


    <div class="items">
        <p class="highlight">Highlighted paragraph</p>
        <p>Normal paragraph</p>
        <p>Another normal paragraph</p>
    </div>

</body>

</html>
