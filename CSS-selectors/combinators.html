<!DOCTYPE html>
<html>

<head>
    <title>Combinator selectors</title>
    <link rel="icon" type="image/x-icon" href="../assets/icons/sparkling/large.png">
    <link rel="stylesheet" href="../styles/combinators.css">
</head>

<body>
    <main class="container">

        <section class="card">

            <h2>CSS Combinators</h2>

            <p>This is the first paragraph.</p>
           
            <div class="content">
                <p>This is a direct child paragraph.</p>
                <div class="nested">
                    <p>This paragraph is nested inside another div.</p>
                </div>
                <p>This paragraph is another direct child.</p>
            </div>

            <p>This paragraph comes immediately after the content div.</p>
            <p>This paragraph is another sibling.</p>

        </section>

    </main>
</body>

</html>
