<!DOCTYPE html>
<html>

<head>
    <title>Input Pseudo Classes</title>
    <link rel="icon" href="../assets/icons/sparkling/large.png" type="image/x-icon">
    <link rel="stylesheet" href="../styles/input-modifiers.css">
</head>

<body>

    <h2>Registration Form - Demonstrating Input Pseudo Classes</h2>

    <form>

        <label>
            Name: <input type="text" required>
        </label>

        <br><br>

        <label>
            Email: <input type="email" required>
        </label>

        <br><br>

        <label>
            Age: <input type="number" min="18" max="60">
        </label>

        <br><br>

        <label>
            Country:
            <input type="text" value="India" readonly>
        </label>

        <br><br>

        <label>
            Referral Code:
            <input type="text">
        </label>

        <br><br>

        <label>
            <input type="checkbox">
            I agree to the terms
        </label>

        <br><br>

        <label>
            Username:
            <input type="text" value="admin" disabled>
        </label>

    </form>

</body>

</html>
