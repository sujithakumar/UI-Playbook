<!DOCTYPE html>
<html>

<head>
    <title>CSS Visibility</title>
    <link rel="icon" href="../assets/icons/sparkling/medium.png">
    <link rel="stylesheet" href="../styles/display.css">
</head>

<body class="visibility">
    <div class="no-styles">
        <h4>Visibility property not applied</h4>
        <span>I am span 1</span>
        <span>Watch ME</span>
        <span>I am span 3</span>
    </div>
    <div>
        <h4>Display: None</h4>
        <span>I am span 1</span>
        <span class="none">I am span 2</span>
        <span>I am span 3</span>
    </div>
    <div>
        <h4>visibility: hidden</h4>
        <span>I am span 1</span>
        <span class="hidden">I am span 2</span>
        <span>I am span 3</span>
    </div>
    <div>
        <h4>Opacity: 0</h4>
        <span class="opacity0">opacity 0</span>
        <span class="opacity1">opacity 1</span>
        <span class="opacity5">opacity 0.5</span>
        <span class="rgba">rgba</span>
    </div>

</body>

</head>
