<!DOCTYPE html>
<html>

<head>
    <title>CSS Position : Fixed Example</title>
    <link rel="stylesheet" href="../styles/position.css">
</head>

<body>

    <div>1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div class="fixed">Class:fixed applied</div>
    <div>5</div>
    <div>6</div>
    <div>
        <section class="fixed-child">Class:fixed applied inside <mark>empty</mark> div</section>
    </div>
    <div>7</div>
    <div>8</div>
    <div>9</div>
    <div class="fixed">
        <section class="fixed-child">Class:fixed applied inside <mark>fixed</mark> div</section>
    </div>
    <div>10</div>
    <div>11</div>
     <div class="relative">
        <section class="fixed-child">Class:fixed applied inside <mark>relative</mark> div</section>
    </div>

</body>

</html>
