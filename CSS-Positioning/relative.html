<!DOCTYPE html>
<html>

<head>
    <title>CSS Position : Relative Example</title>
    <link rel="stylesheet" href="../styles/position.css">
</head>

<body>

    <div></div>
    <div class="relative">Class:relative applied</div>
    <div>
        <section class="relative-child">Class:relative applied inside <mark>empty</mark> div</section>
    </div>
    <div></div>
    <div class="relative">
        <section class="relative-child">Class:relative applied inside <mark>relative</mark> div</section>
    </div>
     <div class="absolute">
        <section class="relative-child">Class:relative applied inside <mark>absolute</mark> div</section>
    </div>


</body>

</html>
