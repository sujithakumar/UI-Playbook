<!DOCTYPE html>
<html>

<head>
    <title>CSS z-index Example</title>
    <link rel="stylesheet" href="../styles/zIndex.css">
</head>

<body>

    <div class="box box1">Box 1 &nbsp; z-index:auto</div>
    <div class="box box2">Box 2 &nbsp; z-index:0</div>
    <div class="box box3">Box 3 &nbsp; z-index:3</div>
    <div class="box box4">Box 4 &nbsp; z-index:-2</div>
    <div class="box box5">Box 5 &nbsp; z-index:1</div>
    <div class="box box6">Box 6 &nbsp; z-index:-1</div>

</body>

</html>
