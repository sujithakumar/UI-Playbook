<!DOCTYPE html>
<html>

<head>
    <title>CSS Clear Example</title>
    <link rel="stylesheet" href="../styles/float-clear.css">
</head>

<body>

    <img class="float-l" src="../assets/images/puppy-pink.jpg" alt="Nature">

    <p>
        This text will flow around the floated image.
        The image is moved to the left, while the text
        occupies the remaining space beside it.
    </p>
    <div class="section">
        This section should appear below the image.
    </div>

    <div class="clear"></div>

    <div class="container">

        <div class="box">Box 1</div>
        <div class="box">Box 2</div>

        <div class="clear"></div>

         <div class="box">Box 3</div>
        <div class="box">Box 4</div>

    </div>

</body>

</html>
