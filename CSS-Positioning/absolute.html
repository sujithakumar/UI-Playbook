<!DOCTYPE html>
<html>

<head>
    <title>CSS Position : Absolute Example</title>
    <link rel="stylesheet" href="../styles/position.css">
</head>

<body>

    <div></div>
    <div class="absolute">Class:absolute applied</div>
    <div>
        <section class="absolute-child">Class:absolute applied inside <mark>empty</mark> div</section>
    </div>
     <div></div>
    <div class="absolute">
        <section class="absolute-child">Class:absolute applied inside <mark>absolute</mark> div</section>
    </div>
     <div></div>
    <div class="relative">
         <section class="absolute-child">Class:absolute applied inside <mark>relative</mark> div</section>
    </div>
    <div></div>

</body>

</html>
