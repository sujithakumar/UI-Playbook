<!DOCTYPE html>
<html>

<head>
    <title>Audio Element</title>
</head>

<body>

    <div>
        <audio controls>
            <source src="../assets/audio/iphone-ringtone.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <div>
         <p><mark>Autoplay Audio on mute and on loop</mark></p>
        <audio controls autoplay loop muted preload="metadata">
            <source src="../assets/audio/ringtone-2.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

</body>

</html>
