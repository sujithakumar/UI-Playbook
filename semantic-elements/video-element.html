<!DOCTYPE html>
<html>

<head>
    <title>Video Element</title>
</head>

<body>

    <div>
        <video controls width="320" height="240">
            <source src="../assets/video/sample-video-1.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
    </div>

    <div>
        <p><mark>Video with poster - thumbnail image</mark></p>
        <video controls poster="../assets/images/cat-thumbnail.jpg" width="320" height="240">
            <source src="../assets/video/sample-video-1.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>

    </div>

    <div>
        <p><mark>Autoplay Video on mute and on loop</mark></p>
        <video controls autoplay loop muted preload="metadata" width="320" height="240">
            <source src="../assets/video/sample-video-1.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
    </div>


</body>

</html>
