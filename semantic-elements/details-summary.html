<body>

   <h3><mark>Details and Summary Elements</mark></h3>

    <details>

        <p>This is the content that is revealed when the details element is expanded.</p>
    </details>

    <details open>

        <p>This is the content that is revealed when the details element is expanded.</p>
    </details>
    
   </div>
