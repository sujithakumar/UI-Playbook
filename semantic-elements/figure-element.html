 <!DOCTYPE html>
<html>

<head>
    <title>Figure Element</title>
</head>

<body>

    <div>
        <p><mark>Figure Element</mark></p>
        <figure>
            <img src="../assets/images/cat-1.jpg" alt="Sample Image" width="300" height="200">
            <figcaption>Cat</figcaption>
        </figure>
         <figure>
            <img src="../assets/images/puppy-2.jpg" alt="Sample Image" width="300" height="200">
            <figcaption>Dog</figcaption>
        </figure>
         <figure>
            <img src="../assets/images/puppy-pink.jpg"alt="Sample Image" width="300" height="200">
            <figcaption>Puppy Pink</figcaption>
        </figure>
        <figure>
            <video width="320" height="240" controls autoplay muted>
                <source src="../assets/video/sample-video-1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <figcaption>Sample Video</figcaption>
        </figure>
    </div>

</body>

</html>
