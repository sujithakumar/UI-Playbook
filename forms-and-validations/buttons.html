<!DOCTYPE html>
<html>

<head>
    <title>Buttons</title>
</head>

<body>
    <form>
        <br>
        <br>
        <fieldset>
            <br>
            <legend>Button Types</legend>
            <br>
            <button type="submit">Submit Information</button>
            &nbsp; &nbsp; &nbsp;
            <button type="reset">Reset Form</button>
            &nbsp; &nbsp; &nbsp;
            <button type="button" onclick="alert('Form submitted!')">Custom Action</button>
            <br> <br> <br>
            <p><mark>Button as Input</mark></p>
            <input type="submit"> Submit Button as Input 
             <input type="reset"> Reset Button as Input 
              <br> <br> <br>
            <p><mark>Button as Input with different values</mark></p>
             <input type="submit" value="submit input"> Submit Button  
             <input type="reset"  value="reset input"> Reset Button 
             <br> <br> <br>

        </fieldset>
    </form>
</body>

</html>
