<!DOCTYPE html>
<html>

<head>
    <title>Tabindex example</title>
</head>

<body>
    <form action="/submit" method="POST">
        Input 1: <input type="text" name="input1" 1 tabindex="3">
        <br> <br>
        Input 2: <input type="text" name="input2" tabindex="0">
        <br> <br>
        Input 3: <input type="text" name="input3" tabindex="1">
        <br> <br>
        Input 4: <input type="text" name="input4" tabindex="4" autofocus>
        <br> <br>
        Input 5: <input type="text" name="input5" tabindex="2" autofocus>
        <br> <br>
        Input 6: <input type="text" name="input6">
        <br> <br>
         Input 7: <input type="text" name="input7" tabindex="1">
        <br> <br>
    </form>

</body>

</html>
