<!DOCTYPE html>
<head>
    <title>Responsive Typography</title>
    <link rel="stylesheet" href="../styles/typography.css">
    <link rel="stylesheet" href="../styles/tablet.css" media="screen and (min-width: 768px)">
    <link rel="stylesheet" href="../styles/desktop.css" media="screen and (min-width: 1024px)">
</head>

<body>

    <h1>Imcluding stylesheet based on media</h1>
    <div class="container">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <p>
            We can attach stylesheets conditionally using the media attribute of the <code>&lt;link&gt;</code> element. However, in modern responsive development, it is more common to use a single CSS file with CSS media queries for maintainability.
        </p>
    </div>

</body>

</html>
