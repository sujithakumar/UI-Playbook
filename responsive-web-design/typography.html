<!DOCTYPE html>
<head>
    <title>Responsive Typography</title>
    <link rel="stylesheet" href="../styles/typography.css">
</head>

<body>

    <h1>Responsive Typography</h1>

    <h2>Typography adapts to screen size</h2>

    <p class="subtitle">
        This text uses vw and changes according to the viewport width.
    </p>

    <p>
        This paragraph uses rem for a scalable and accessible font size.
        The heading uses clamp() so it can grow and shrink within defined limits.
    </p>

</body>

</html>
